name: AdversarialWeb CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dashboard]'

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: adversarialweb > /tmp/adversarialweb-report.json

      - name: Compile package and dashboard
        run: python -m compileall -q adversarialweb dashboard

      - name: Import smoke test
        run: python -c "from adversarialweb.data import generate_sessions; assert len(generate_sessions(400)) == 400"
