<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1400" height="300" rx="22" fill="url(#bg)"/>
  <text x="42" y="46" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800">Detection Gap Investigation Loop</text>
  <text x="42" y="70" fill="#94a3b8" font-family="Inter,Segoe UI,Arial" font-size="13">A repeatable workflow for false positives, false negatives, and emerging attack behavior</text>
  <g font-family="Inter,Segoe UI,Arial" text-anchor="middle">
    <g><circle cx="120" cy="170" r="54" fill="#172554" stroke="#3b82f6"/><text x="120" y="164" fill="#dbeafe" font-size="14" font-weight="700">Escalation</text><text x="120" y="184" fill="#93c5fd" font-size="11">FP / FN / miss</text></g>
    <g><circle cx="350" cy="170" r="54" fill="#172554" stroke="#3b82f6"/><text x="350" y="164" fill="#dbeafe" font-size="14" font-weight="700">Reproduce</text><text x="350" y="184" fill="#93c5fd" font-size="11">slice + evidence</text></g>
    <g><circle cx="580" cy="170" r="54" fill="#172554" stroke="#3b82f6"/><text x="580" y="164" fill="#dbeafe" font-size="14" font-weight="700">Root cause</text><text x="580" y="184" fill="#93c5fd" font-size="11">signal failure</text></g>
    <g><circle cx="810" cy="170" r="54" fill="#172554" stroke="#3b82f6"/><text x="810" y="164" fill="#dbeafe" font-size="14" font-weight="700">Targeted fix</text><text x="810" y="184" fill="#93c5fd" font-size="11">rule / feature</text></g>
    <g><circle cx="1040" cy="170" r="54" fill="#172554" stroke="#3b82f6"/><text x="1040" y="164" fill="#dbeafe" font-size="14" font-weight="700">Re-tune</text><text x="1040" y="184" fill="#93c5fd" font-size="11">FP guardrail</text></g>
    <g><circle cx="1270" cy="170" r="54" fill="#052e2b" stroke="#22c55e"/><text x="1270" y="164" fill="#dcfce7" font-size="14" font-weight="700">Verify</text><text x="1270" y="184" fill="#86efac" font-size="11">before vs after</text></g>
  </g>
  <g stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="177" y1="170" x2="288" y2="170"/><line x1="407" y1="170" x2="518" y2="170"/><line x1="637" y1="170" x2="748" y2="170"/><line x1="867" y1="170" x2="978" y2="170"/><line x1="1097" y1="170" x2="1208" y2="170"/>
  </g>
</svg>